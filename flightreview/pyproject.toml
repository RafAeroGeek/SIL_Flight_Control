[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flightreview"
version = "0.1.0"
description = "Visor interactivo de logs de vuelo (CSV) estilo Flight Review"
requires-python = ">=3.9"
dependencies = ["bokeh>=3.8", "pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
cache = ["pyarrow>=10"]
dev = ["pytest>=7"]

# Layout plano: el paquete importable es este mismo directorio.
[tool.setuptools]
packages = ["flightreview", "flightreview.parser", "flightreview.plots"]
package-dir = { flightreview = "." }

[tool.pytest.ini_options]
testpaths = ["tests"]
